<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>flipbook</title>
    <style>
:root {
  color-scheme: dark;
  font-family: monospace;
  background: #111;
  color: #f4f4f4;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

.viewer {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100vw;
  width: 100dvw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #111;
}

.image-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.image,
.video {
  position: absolute;
  inset: 0;
  display: block;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.image[hidden],
.video[hidden] {
  display: none;
}

.video-navigation {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: max(0.75rem, env(safe-area-inset-left));
  padding-right: max(0.75rem, env(safe-area-inset-right));
  pointer-events: none;
}

.video-navigation[hidden] {
  display: none;
}

.video-navigation button {
  display: grid;
  place-items: center;
  width: 3rem;
  height: 3rem;
  border: 1px solid rgb(255 255 255 / 60%);
  border-radius: 50%;
  background: rgb(0 0 0 / 55%);
  color: #fff;
  font: inherit;
  font-size: 2rem;
  line-height: 1;
  cursor: pointer;
  pointer-events: auto;
}

.video-navigation button:disabled {
  opacity: 0.4;
  cursor: default;
}

.video-error {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 1rem;
  padding: 1rem;
  background: #111;
  text-align: center;
}

.video-error[hidden] {
  display: none;
}

.video-error button {
  padding: 0.6rem 1rem;
  font: inherit;
  cursor: pointer;
}

.caption {
  position: absolute;
  z-index: 1;
  bottom: 0;
  left: 0;
  width: fit-content;
  max-width: min(90vw, 120ch);
  color: #111;
}

.viewer[data-media-type="video"] .caption {
  bottom: max(5rem, calc(env(safe-area-inset-bottom) + 5rem));
}

.caption[hidden] {
  display: none;
}

.caption-text {
  display: inline;
  margin: 0;
  background: #fff;
  font-size: clamp(1rem, 2vw, 1.75rem);
  line-height: 1.2;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.position {
  position: fixed;
  z-index: 1;
  top: max(0.75rem, env(safe-area-inset-top));
  left: max(0.75rem, env(safe-area-inset-left));
  margin: 0;
  font-size: 0.75rem;
  line-height: 1;
  text-shadow: 0 1px 3px #000;
}

.loading {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  color: #f4f4f4;
}

.loading[hidden] {
  display: none;
}

/* Arc spinner adapted from loading.dev (MIT). */
.loading-arc {
  width: 3rem;
  height: 3rem;
  filter: drop-shadow(0 1px 3px #000);
}

.loading-arc-spin {
  transform-origin: center;
  animation: loading-arc-rotate 800ms linear infinite;
}

@keyframes loading-arc-rotate {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .loading-arc-spin {
    animation: none;
  }
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

    </style>
  </head>
  <body>
    <main id="viewer" class="viewer" aria-busy="true" aria-label="flipbook media viewer">
      <div id="image-stage" class="image-stage">
        <img id="image" class="image" alt="" />
        <video id="video" class="video" controls playsinline preload="metadata" hidden></video>
        <div id="video-navigation" class="video-navigation" hidden>
          <button id="previous-video-item" type="button" aria-label="Previous item">‹</button>
          <button id="next-video-item" type="button" aria-label="Next item">›</button>
        </div>
        <section id="video-error" class="video-error" role="alert" hidden>
          <p>Could not play this video.</p>
          <button id="retry-video" type="button">Retry</button>
        </section>
      </div>
      <section id="caption" class="caption" aria-label="Media caption" hidden>
        <p id="caption-text" class="caption-text"></p>
      </section>
      <p id="position" class="position" aria-live="polite"></p>
      <div id="loading" class="loading" role="status">
        <!-- Arc from loading.dev, inlined because this is a standalone non-React app. -->
        <svg class="loading-arc" fill="none" aria-hidden="true" viewBox="0 0 24 24">
          <circle class="loading-arc-spin" cx="12" cy="12" r="10" stroke="currentColor" stroke-dasharray="18 44.8" stroke-linecap="round" stroke-width="2.5" />
        </svg>
        <span class="visually-hidden">Loading media</span>
      </div>
    </main>
    <script>
const viewer = document.querySelector("#viewer");
const image = document.querySelector("#image");
let video = document.querySelector("#video");
const videoNavigation = document.querySelector("#video-navigation");
const previousVideoItem = document.querySelector("#previous-video-item");
const nextVideoItem = document.querySelector("#next-video-item");
const videoError = document.querySelector("#video-error");
const retryVideo = document.querySelector("#retry-video");
const position = document.querySelector("#position");
const caption = document.querySelector("#caption");
const captionText = document.querySelector("#caption-text");
const loading = document.querySelector("#loading");
const defaultManifestUrl = "https://cdn.kahvipatel.com/newsletter-assets/manifest.json";
const defaultPageTitle = "flipbook";
const manifestStorageKey = "flipbook:manifest-url";
const supportedImageExtensions = /\.(avif|gif|jpe?g|png|svg|webp)$/i;
const supportedVideoExtensions = /\.mp4$/i;
const preloadAhead = 2;
const preloadBehind = 1;
const imageSizes = "100vw";
const edgeTapFraction = 1 / 3;
let assets = [];
const preloads = new Map();
const videoMetadataPreloads = new Map();
let navigationDirection = 1;
let renderVersion = 0;

function configuredManifestUrl() {
  const fromQuery = new URLSearchParams(window.location.search).get("manifest");
  if (fromQuery) return fromQuery;
  try {
    return localStorage.getItem(manifestStorageKey) || defaultManifestUrl;
  } catch {
    return defaultManifestUrl;
  }
}

function isSupportedUrl(url, extensions) {
  try {
    if (typeof url !== "string") return false;
    const parsed = new URL(url);
    return /^https?:$/.test(parsed.protocol) && extensions.test(parsed.pathname);
  } catch {
    return false;
  }
}

function isSupportedImageUrl(url) {
  return isSupportedUrl(url, supportedImageExtensions);
}

function isSupportedVideoUrl(url) {
  return isSupportedUrl(url, supportedVideoExtensions);
}

function srcsetFor(asset) {
  return asset.srcset.map(({ url, width }) => `${url} ${width}w`).join(", ");
}

function applyFullSource(target, asset, resolvedUrl = asset.url) {
  const srcset = srcsetFor(asset);
  target.sizes = imageSizes;
  target.srcset = srcset;
  target.src = resolvedUrl;
}

function applyPreviewSource(target, asset) {
  target.removeAttribute("srcset");
  target.removeAttribute("sizes");
  target.src = asset.preview;
}

function setLoading(isLoading) {
  loading.hidden = !isLoading;
  viewer.setAttribute("aria-busy", String(isLoading));
}

const manifestUrl = configuredManifestUrl();
let currentIndex = 0;
let manifestTitle = defaultPageTitle;

async function loadManifest() {
  if (typeof manifestUrl !== "string" || !/^https?:\/\//i.test(manifestUrl)) {
    throw new Error("Set an HTTP(S) manifest URL");
  }

  const response = await fetch(manifestUrl, { cache: "no-store" });
  if (!response.ok) throw new Error(`Could not load manifest: ${response.status} ${response.statusText}`);

  const loadedManifest = await response.json();
  const manifest = Array.isArray(loadedManifest) ? { images: loadedManifest } : loadedManifest;
  if (!manifest || typeof manifest !== "object" || Array.isArray(manifest)) {
    throw new Error("Manifest must be an object or an array");
  }
  if (Object.hasOwn(manifest, "title") && typeof manifest.title !== "string") {
    throw new Error("Manifest title must be a string");
  }
  if (Object.hasOwn(manifest, "items") && Object.hasOwn(manifest, "images")) {
    console.warn('Manifest contains both "items" and legacy "images"; ignoring "images".');
  }
  const entries = Object.hasOwn(manifest, "items") ? manifest.items : manifest.images;
  if (!Array.isArray(entries)) throw new Error('Manifest must contain an "items" or "images" array');

  const nextAssets = [];
  for (const [index, entry] of entries.entries()) {
    if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
      console.warn(`Skipping manifest item ${index + 1}: entry must be an object`);
      continue;
    }

    const type = Object.hasOwn(entry, "type") ? entry.type : "image";
    let reason;
    if (type !== "image" && type !== "video") reason = `unsupported type "${type}"`;
    else if (typeof entry.url !== "string") reason = "missing URL";
    else if (type === "video" && !isSupportedVideoUrl(entry.url)) reason = "video URL must be an HTTP(S) MP4";
    else if (type === "image" && !isSupportedImageUrl(entry.url)) reason = "unsupported image URL";
    else if (Object.hasOwn(entry, "caption") && typeof entry.caption !== "string") reason = "caption must be a string";
    else if (type === "video" && Object.hasOwn(entry, "poster") && !isSupportedImageUrl(entry.poster)) reason = "poster must be an HTTP(S) image URL";
    else if (type === "image" && Object.hasOwn(entry, "preview") && !isSupportedImageUrl(entry.preview)) reason = "preview must be an HTTP(S) image URL";

    const srcset = type === "image" ? (entry.srcset || []) : [];
    if (!reason && type === "image") {
      if (!Array.isArray(srcset)) reason = "srcset must be an array";
      else {
        let previousWidth = 0;
        for (const candidate of srcset) {
          if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)
            || !isSupportedImageUrl(candidate.url) || !Number.isSafeInteger(candidate.width)
            || candidate.width <= previousWidth) {
            reason = "invalid srcset candidate";
            break;
          }
          previousWidth = candidate.width;
        }
      }
    }
    if (reason) {
      console.warn(`Skipping manifest item ${index + 1}: ${reason}`);
      continue;
    }

    nextAssets.push({
      type,
      url: entry.url,
      preview: type === "image" ? (entry.preview || null) : null,
      poster: type === "video" ? (entry.poster || null) : null,
      srcset,
      caption: entry.caption || ""
    });
  }

  assets = nextAssets;
  manifestTitle = manifest.title?.trim() || defaultPageTitle;
  document.title = manifestTitle;
}

function currentCaption() {
  return assets[currentIndex].caption;
}

function renderCaption() {
  const text = currentCaption();
  captionText.textContent = text;
  caption.hidden = text.length === 0;
}

function indexFromHash() {
  const position = Number.parseInt(window.location.hash.slice(1), 10);
  const index = position - 1;
  return Number.isInteger(index) && index >= 0 && index < assets.length ? index : 0;
}

function updateHash() {
  const url = new URL(window.location.href);
  url.hash = String(currentIndex + 1);
  history.replaceState(null, "", url);
}

function loadFullImage(index, priority = "low") {
  if (index < 0 || index >= assets.length || assets[index].type !== "image") return null;

  const existing = preloads.get(index);
  if (existing) {
    if (priority === "high") existing.image.fetchPriority = "high";
    return existing;
  }

  const preloadImage = new Image();
  preloadImage.decoding = "async";
  preloadImage.fetchPriority = priority;
  applyFullSource(preloadImage, assets[index]);
  const entry = {
    image: preloadImage,
    promise: preloadImage.decode().then(() => preloadImage)
  };
  preloads.set(index, entry);
  return entry;
}

function preloadVideoMetadata(index) {
  if (index < 0 || index >= assets.length || index === currentIndex || assets[index].type !== "video"
    || videoMetadataPreloads.has(index)) return;

  const preloadVideo = document.createElement("video");
  preloadVideo.preload = "metadata";
  preloadVideo.muted = true;
  preloadVideo.playsInline = true;
  preloadVideo.src = assets[index].url;
  preloadVideo.load();
  videoMetadataPreloads.set(index, preloadVideo);
}

function trimPreloads() {
  const keep = new Set([currentIndex]);
  for (let step = 1; step <= preloadAhead; step += 1) keep.add(currentIndex + navigationDirection * step);
  for (let step = 1; step <= preloadBehind; step += 1) keep.add(currentIndex - navigationDirection * step);

  for (const [index, entry] of preloads) {
    if (!keep.has(index)) {
      entry.image.src = "";
      preloads.delete(index);
    }
  }
  for (const [index, preloadVideo] of videoMetadataPreloads) {
    if (!keep.has(index) || index === currentIndex) {
      preloadVideo.removeAttribute("src");
      preloadVideo.load();
      videoMetadataPreloads.delete(index);
    }
  }
}

function preloadAroundCurrent() {
  for (let step = 1; step <= preloadAhead; step += 1) {
    const index = currentIndex + navigationDirection * step;
    loadFullImage(index)?.promise.catch(() => {});
    preloadVideoMetadata(index);
  }
  for (let step = 1; step <= preloadBehind; step += 1) {
    const index = currentIndex - navigationDirection * step;
    loadFullImage(index)?.promise.catch(() => {});
    preloadVideoMetadata(index);
  }
  trimPreloads();
}

function assetName(asset) {
  const filename = new URL(asset.url).pathname.split("/").pop() || "media";
  try {
    return decodeURIComponent(filename);
  } catch {
    return filename;
  }
}

function stopVideo() {
  video.pause();
  video.removeAttribute("src");
  video.removeAttribute("poster");
  video.load();
}

function attachVideo(asset, version) {
  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.hidden = false;
  video.setAttribute("aria-label", asset.caption || assetName(asset));
  if (asset.poster) video.poster = asset.poster;
  video.addEventListener("loadedmetadata", () => {
    if (version === renderVersion) setLoading(false);
  }, { once: true });
  video.addEventListener("error", () => {
    if (version !== renderVersion) return;
    console.error(`Could not play ${asset.url}`, video.error);
    video.hidden = true;
    videoError.hidden = false;
    setLoading(false);
  }, { once: true });
  video.src = asset.url;
  video.load();
}

function render() {
  const version = ++renderVersion;
  const asset = assets[currentIndex];
  stopVideo();
  video.hidden = true;
  videoError.hidden = true;
  image.hidden = asset.type !== "image";
  viewer.dataset.mediaType = asset.type;
  position.textContent = `${currentIndex + 1} / ${assets.length}`;
  renderCaption();
  updateHash();

  videoNavigation.hidden = asset.type !== "video";
  previousVideoItem.disabled = currentIndex === 0;
  nextVideoItem.disabled = currentIndex === assets.length - 1;

  if (asset.type === "video") {
    image.removeAttribute("src");
    image.removeAttribute("srcset");
    image.removeAttribute("sizes");
    setLoading(false);
    attachVideo(asset, version);
  } else {
    image.alt = assetName(asset);
    image.fetchPriority = "high";
    setLoading(true);
    if (asset.preview) applyPreviewSource(image, asset);

    const fullImage = loadFullImage(currentIndex, "high");
    fullImage.promise.then((loadedImage) => {
      if (version !== renderVersion) return;
      applyFullSource(image, asset, loadedImage.currentSrc || asset.url);
      setLoading(false);
    }).catch(() => {
      if (version !== renderVersion) return;
      console.error(`Could not load ${asset.url}`);
      if (!asset.preview) image.src = asset.url;
      setLoading(false);
    });
  }

  preloadAroundCurrent();
}

function goTo(index) {
  if (index < 0 || index >= assets.length || index === currentIndex) return;
  navigationDirection = index > currentIndex ? 1 : -1;
  currentIndex = index;
  render();
}

function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
}

image.addEventListener("error", () => {
  console.error(`Could not load ${image.src}`);
});

previousVideoItem.addEventListener("click", () => goTo(currentIndex - 1));
nextVideoItem.addEventListener("click", () => goTo(currentIndex + 1));
retryVideo.addEventListener("click", () => {
  const asset = assets[currentIndex];
  if (!asset || asset.type !== "video") return;

  video.pause();
  video.removeAttribute("src");
  video.load();
  const replacement = document.createElement("video");
  replacement.id = "video";
  replacement.className = "video";
  replacement.controls = true;
  replacement.playsInline = true;
  replacement.preload = "metadata";
  video.replaceWith(replacement);
  video = replacement;
  videoError.hidden = true;
  attachVideo(asset, renderVersion);
});

viewer.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || !assets[currentIndex] || assets[currentIndex].type !== "image") return;

  const bounds = viewer.getBoundingClientRect();
  const horizontalPosition = (event.clientX - bounds.left) / bounds.width;
  if (horizontalPosition < edgeTapFraction) {
    goTo(currentIndex - 1);
  } else if (horizontalPosition > 1 - edgeTapFraction) {
    goTo(currentIndex + 1);
  }
});

window.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;

  if (event.key === "ArrowLeft" || event.key.toLowerCase() === "h") {
    event.preventDefault();
    goTo(currentIndex - 1);
  } else if (event.key === "ArrowRight" || event.key.toLowerCase() === "l") {
    event.preventDefault();
    goTo(currentIndex + 1);
  } else if (event.key === "Home") {
    event.preventDefault();
    goTo(0);
  } else if (event.key === "End") {
    event.preventDefault();
    goTo(assets.length - 1);
  } else if (event.key.toLowerCase() === "f") {
    toggleFullscreen();
  }
}, true);

window.addEventListener("hashchange", () => {
  const targetIndex = indexFromHash();
  if (targetIndex !== currentIndex) {
    navigationDirection = targetIndex > currentIndex ? 1 : -1;
    currentIndex = targetIndex;
    render();
  }
});

async function initialize() {
  try {
    await loadManifest();
    if (assets.length === 0) {
      position.textContent = "No supported items in the manifest";
      setLoading(false);
    } else {
      currentIndex = indexFromHash();
      render();
    }
  } catch (error) {
    console.error(error);
    position.textContent = "Could not load image manifest";
    setLoading(false);
  }
}

initialize();
    </script>
  </body>
</html>
